[project]
name = "enterprise-rag"
version = "0.1.0"
description = "企业级通用 RAG 系统：私有化单租户部署，企业内多业务线对应多知识库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "pymilvus>=2.4",
    "elasticsearch>=8.13,<9",
    "boto3>=1.34",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # SQL AST 解析：结构化检索只允许通过 AST 校验后的只读查询
    "sqlglot>=25.0",
    "pyjwt[crypto]>=2.8",
    "ldap3>=2.9",
    # 二进制文档解析：PDF / Word / PowerPoint / Excel
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
# 本地模型（GPU/CPU）为可选依赖，未安装时自动走远程 API
local-models = ["sentence-transformers>=3.0", "torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380", "fakeredis>=2.20"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文全角标点/中文字符不视为“歧义字符”；B027 允许基类提供空的 close 默认实现
ignore = ["RUF001", "RUF002", "RUF003", "B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 依赖 docker compose 真实服务（PG/Redis 等）的集成测试",
]

[tool.pyright]
include = ["app", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# 可选依赖（torch/transformers/boto3 等）缺失时降级为警告，由运行时给出清晰报错
reportMissingImports = "warning"
